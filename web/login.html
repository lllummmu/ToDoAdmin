<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>登录</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
<div id="app">
    <h2>登录</h2>
    <input v-model="username" placeholder="用户名"/>
    <input type="password" v-model="password" placeholder="密码"/>
    <button @click="login">登录</button>
    <p>{{ msg }}</p>
    <a href="register.html">注册新用户</a>
</div>

<script>
    const { createApp } = Vue;
    createApp({
        data(){ return { username:'', password:'', msg:'' }; },
        methods:{
            login(){
                axios.post('login', new URLSearchParams({username:this.username, password:this.password}))
                    .then(res=>{
                        if(res.data==='success'){
                            sessionStorage.setItem('userName', this.username); // ✅ 存名字
                            location.href='index.html';
                        }else{
                            this.msg='登录失败';
                        }
                    });
            }
        }
    }).mount('#app');
</script>
</body>
</html>
